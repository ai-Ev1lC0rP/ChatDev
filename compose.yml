services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: chatdev_backend
    volumes:
      - .:/app
    ports:
      - "6400:6400"
    env_file:
      - .env
      - .env.docker
    restart: unless-stopped
    # When using profile omniroute, point BASE_URL at the gateway service
    # (set in .env): BASE_URL=http://omniroute:20128/v1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: chatdev_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - .env
      - .env.docker
    depends_on:
      - backend
    restart: unless-stopped

  # Optional multi-provider AI gateway for model onboarding.
  # Start with: docker compose --profile omniroute up -d
  # Then: make onboard-models ONBOARD_ARGS='--provider omniroute --yes'
  # Host dashboard: http://localhost:20128
  omniroute:
    profiles: ["omniroute"]
    image: diegosouzapw/omniroute:latest
    container_name: chatdev_omniroute
    ports:
      - "${OMNIROUTE_PORT:-20128}:20128"
    volumes:
      - omniroute-data:/app/data
    restart: unless-stopped

volumes:
  omniroute-data:
